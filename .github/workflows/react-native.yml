name: React Native

on:
  pull_request:
    paths:
      - packages/react-native/**
      - .github/workflows/react-native.yml
  push:
    branches: [main]
    paths:
      - packages/react-native/**
      - .github/workflows/react-native.yml

permissions: {}

cache-mode: none

concurrency:
  group: react-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @peage/protocol --filter @peage/react-native pack --pack-destination "$RUNNER_TEMP/tarballs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android (React Native ${{ matrix.react-native }})
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        react-native: [0.76.9, 0.80.3, 0.84.1, 0.88.0]
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
      - name: Create the template app
        env:
          REACT_NATIVE: ${{ matrix.react-native }}
        run: |
          npm pack "@react-native-community/template@$REACT_NATIVE" --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/react-native-community-template-$REACT_NATIVE.tgz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/package/template" "$RUNNER_TEMP/app"
      - name: Install the app and Péage
        working-directory: ${{ runner.temp }}/app
        run: |
          for tarball in "$RUNNER_TEMP"/tarballs/*.tgz; do
            name=$(tar -xOzf "$tarball" package/package.json | jq -r .name)
            npm pkg set "dependencies.$name=file:$tarball"
          done
          npm install --no-audit --no-fund --ignore-scripts --min-release-age=7
      - name: Build the app
        working-directory: ${{ runner.temp }}/app/android
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon

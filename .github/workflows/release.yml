name: Release

on:
  workflow_dispatch:

permissions: {}

cache-mode: none

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --recursive --filter './packages/*' --filter '!@peage/tests' pack --pack-destination "$RUNNER_TEMP/tarballs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
          if-no-files-found: error
          retention-days: 1

  stage:
    name: Stage on npm
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write # npm trusted publishing (OIDC) and provenance signing
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
      - name: Stage each version not yet on npm
        run: |
          packages=(protocol core store-memory store-redis express react-native)
          tarballs=("$RUNNER_TEMP"/tarballs/*.tgz)
          if [ "${#tarballs[@]}" -ne "${#packages[@]}" ]; then
            echo "::error::Expected ${#packages[@]} tarballs, found ${#tarballs[@]}"
            exit 1
          fi
          failed=()
          for package in "${packages[@]}"; do
            matches=("$RUNNER_TEMP"/tarballs/peage-"$package"-[0-9]*.tgz)
            tarball=${matches[0]}
            manifest=$(tar --extract --gzip --to-stdout --file "$tarball" package/package.json)
            name=$(node --print 'JSON.parse(process.argv[1]).name' "$manifest")
            version=$(node --print 'JSON.parse(process.argv[1]).version' "$manifest")
            if [ "${#matches[@]}" -ne 1 ] || [ "$name" != "@peage/$package" ] || [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Refusing $tarball ($name@$version)"
              exit 1
            fi
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm"
            elif npm stage publish "$tarball" --access public --provenance; then
              echo "- \`$name@$version\` sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 --wrap=0)" >> "$GITHUB_STEP_SUMMARY"
            else
              failed+=("$name@$version")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed to stage ${failed[*]}"
            exit 1
          fi

name: GitHub release

on:
  workflow_dispatch:

permissions: {}

cache-mode: none

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    name: Create the GitHub release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a release for the version live on npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packages=(protocol core store-memory store-redis express react-native)
          versionOf() {
            node --print 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).version' "packages/$1/package.json"
          }
          version=$(versionOf protocol)
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already has a release"
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          for package in "${packages[@]}"; do
            name="@peage/$package"
            if [ "$(versionOf "$package")" != "$version" ]; then
              echo "::error::$name is not at $version"
              exit 1
            fi
            if [ "$(npm view "$name@$version" version 2>/dev/null)" != "$version" ]; then
              echo "::error::$name@$version is not live on npm yet"
              exit 1
            fi
            {
              printf '## %s\n\nhttps://www.npmjs.com/package/%s/v/%s\n' "$name" "$name" "$version"
              awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' "packages/$package/CHANGELOG.md"
              printf '\n'
            } >> "$notes"
          done
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes"

name: GitHub release

on:
  workflow_dispatch: # on the version tag

permissions: {}

cache-mode: none

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    name: Create the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a release for the version live on npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          packages=(protocol core store-memory store-redis express react-native)
          releaseWorkflow="https://github.com/peage-dev/peage .github/workflows/release.yml"
          versionOf() {
            node --print 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).version' "packages/$1/package.json"
          }
          provenanceOf() {
            curl --fail --silent --show-error "https://registry.npmjs.org/-/npm/v1/attestations/@peage%2f$1@$2" |
              jq 'first(.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1")) | .bundle.dsseEnvelope.payload | @base64d | fromjson'
          }
          workflowOf() {
            jq --raw-output '.predicate.buildDefinition.externalParameters.workflow | "\(.repository) \(.path)"' <<< "$1"
          }
          commitOf() {
            jq --raw-output '.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit' <<< "$1"
          }
          releaseNotesOf() {
            local name="@peage/$1"
            printf '## %s\n\nhttps://www.npmjs.com/package/%s/v/%s\n' "$name" "$name" "$version"
            awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' "packages/$1/CHANGELOG.md"
            printf '\n'
          }
          version=$(versionOf protocol)
          tag="v$version"
          if [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::$GITHUB_REF_NAME is not the tag of $version"
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already has a release"
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          for package in "${packages[@]}"; do
            name="@peage/$package"
            if [ "$(versionOf "$package")" != "$version" ]; then
              echo "::error::$name is not at $version"
              exit 1
            fi
            if [ "$(npm view "$name@$version" version 2>/dev/null)" != "$version" ]; then
              echo "::error::$name@$version is not live on npm yet"
              exit 1
            fi
            provenance=$(provenanceOf "$package" "$version")
            if [ -z "$provenance" ]; then
              echo "::error::$name@$version has no npm provenance"
              exit 1
            fi
            if [ "$(workflowOf "$provenance")" != "$releaseWorkflow" ]; then
              echo "::error::$name@$version was not built by $releaseWorkflow"
              exit 1
            fi
            commit=$(commitOf "$provenance")
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$name@$version provenance has no git commit"
              exit 1
            fi
            if [ "$commit" != "$GITHUB_SHA" ]; then
              echo "::error::$name@$version was built from $commit, not $GITHUB_SHA where $tag is"
              exit 1
            fi
            releaseNotesOf "$package" >> "$notes"
          done
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes"
